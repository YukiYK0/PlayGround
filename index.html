/* ============================================================
   CAMERA, PIXEL ART RENDERER
   ============================================================ */

class Camera {
  constructor(){
    this.x=10; this.y=8; this.zoom=1; this.targetZoom=1;
    this.follow=true; this.shake=0; this.viewW=360; this.viewH=700;
  }
  worldToScreen(wx,wy){
    return {x:(wx-this.x)*this.zoom*TILE + this.viewW/2, y:(wy-this.y)*this.zoom*TILE + this.viewH/2};
  }
  screenToWorld(sx,sy){
    return {x:(sx-this.viewW/2)/(this.zoom*TILE)+this.x, y:(sy-this.viewH/2)/(this.zoom*TILE)+this.y};
  }
  panBy(dx,dy){ this.x-=dx/(this.zoom*TILE); this.y-=dy/(this.zoom*TILE); this.follow=false; }
  zoomBy(factor, centerX=null, centerY=null){
    const before=centerX!=null?this.screenToWorld(centerX,centerY):null;
    this.zoom=clamp(this.zoom*factor,0.55,1.7); this.targetZoom=this.zoom;
    if(before && centerX!=null){
      const after=this.screenToWorld(centerX,centerY);
      this.x+=before.x-after.x; this.y+=before.y-after.y;
    }
  }
  update(dt,char,lot){
    this.zoom=lerp(this.zoom,this.targetZoom,1-Math.pow(0.001,dt));
    if(this.shake>0) this.shake=Math.max(0,this.shake-dt*3);
    if(this.follow && char && !char.hidden){
      const k=1-Math.pow(0.002,dt);
      this.x=lerp(this.x,char.x,k); this.y=lerp(this.y,char.y-0.25,k);
    }
    this.clamp(lot);
  }
  clamp(lot){
    if(!lot) return;
    const halfW=(this.viewW/this.zoom)/TILE/2;
    const halfH=(this.viewH/this.zoom)/TILE/2;
    const minX=halfW-1.2, maxX=lot.w-halfW+1.2;
    const minY=halfH-1.8, maxY=lot.h-halfH+1.2;
    if(minX>maxX) this.x=lot.w/2; else this.x=clamp(this.x,minX,maxX);
    if(minY>maxY) this.y=lot.h/2; else this.y=clamp(this.y,minY,maxY);
  }
  focusWorld(x,y){ this.x=x; this.y=y; }
}

/* ---------- Pixel drawing helpers ---------- */
function px(ctx,x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function shadeColor(hex,amt){
  try{
    let h=hex.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
    let n=parseInt(h,16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=clamp(r+amt,0,255);g=clamp(g+amt,0,255);b=clamp(b+amt,0,255);
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }catch(e){return hex;}
}
function darken(hex,amt){ return shadeColor(hex,-amt); }
function lighten(hex,amt){ return shadeColor(hex,amt); }

/* ---------- Character art ---------- */
function drawPersonArt(ctx, footX, footY, char, opts={}){
  const scale = opts.scale ?? (char.stageInfo.id==='bebe'?0.66:char.stageInfo.id==='crianca'?0.82:char.stageInfo.id==='adolescente'?0.92:char.stageInfo.id==='idoso'?0.92:1);
  const S = scale;
  const walk = opts.walk || 0;
  const state = opts.state || 'idle';
  const t = opts.time || 0;
  const outfit = char.outfitColor || char.appearance?.outfits?.casual || '#5f9f92';
  const skin = char.appearance?.skin || '#d79b73';
  const hair = char.appearance?.hair || '#4a2c20';
  const eye = char.appearance?.eyes || '#38251c';
  const style = char.appearance?.hairStyle || 'curto';
  const outline = '#2a1d2d';
  const moving = !!opts.walking;
  const bob = moving ? Math.sin(walk*8)*1.2 : Math.sin(t*2.2+char.avatarSeed)*0.45;
  const baseX = footX, baseY = footY + bob;
  const legSwing = moving ? Math.sin(walk*8)*4 : 0;
  const standing = !['sleep'].includes(state);
  const sitting = ['sit','eat','read','paint','write','type','guitar','piano','toilet'].includes(state);
  const dancing = state==='dance';
  const armsUp = state==='workout' || dancing;
  const lie = state==='sleep';

  if(opts.shadow !== false && !lie){
    ctx.fillStyle='rgba(24,16,28,0.24)';
    ctx.beginPath(); ctx.ellipse(baseX,baseY+1,9*S,3.5*S,0,0,Math.PI*2); ctx.fill();
  }
  if(lie){
    // side-lying pose on bed/couch
    px(ctx,baseX-18*S,baseY-8*S,32*S,10*S,outline);
    px(ctx,baseX-17*S,baseY-7*S,30*S,8*S,outfit);
    px(ctx,baseX-24*S,baseY-10*S,10*S,10*S,skin);
    px(ctx,baseX-25*S,baseY-12*S,12*S,5*S,hair);
    px(ctx,baseX-11*S,baseY-6*S,10*S,3*S,darken(outfit,18));
    return;
  }

  if(sitting){
    // legs folded
    px(ctx,baseX-7*S,baseY-9*S,5*S,9*S,outline);
    px(ctx,baseX+2*S,baseY-9*S,5*S,9*S,outline);
    px(ctx,baseX-6*S,baseY-10*S,4*S,8*S,darken(outfit,45));
    px(ctx,baseX+2*S,baseY-10*S,4*S,8*S,darken(outfit,35));
  } else {
    px(ctx,baseX-6*S,baseY-10*S,5*S,10*S,outline);
    px(ctx,baseX+1*S,baseY-10*S,5*S,10*S,outline);
    px(ctx,baseX-5*S,baseY-9*S,4*S,9*S,darken(outfit,40));
    px(ctx,baseX+1*S,baseY-9*S,4*S,9*S,darken(outfit,40));
    // shoes
    px(ctx,baseX-6*S+legSwing*0.25,baseY-3*S,5*S,3*S,'#3b2d34');
    px(ctx,baseX+1*S-legSwing*0.25,baseY-3*S,5*S,3*S,'#3b2d34');
  }
  // torso
  const torsoY=baseY-(sitting?21:25)*S;
  px(ctx,baseX-7.5*S,torsoY,15*S,(sitting?12:14)*S,outline);
  px(ctx,baseX-6.5*S,torsoY+1,13*S,(sitting?10:12)*S,outfit);
  if(char.gender==='feminino' && char.age>=18 && char.appearance?.hairStyle!=='careca'){
    // subtle pixel highlight
    px(ctx,baseX-5*S,torsoY+2,2*S,8*S,lighten(outfit,18));
  }
  // arms
  const armY=torsoY+2;
  if(armsUp){
    px(ctx,baseX-12*S,armY-5*S,4*S,9*S,outline);
    px(ctx,baseX+8*S,armY-5*S,4*S,9*S,outline);
    px(ctx,baseX-11*S,armY-5*S,3*S,8*S,skin);
    px(ctx,baseX+8*S,armY-5*S,3*S,8*S,skin);
  } else if(dancing){
    px(ctx,baseX-13*S,armY+Math.sin(t*8)*2,4*S,9*S,skin);
    px(ctx,baseX+9*S,armY-Math.sin(t*8)*2,4*S,9*S,skin);
  } else {
    px(ctx,baseX-10.5*S,armY+(moving?legSwing*0.5:0),4*S,9*S,outline);
    px(ctx,baseX+6.5*S,armY-(moving?legSwing*0.5:0),4*S,9*S,outline);
    px(ctx,baseX-10*S,armY+(moving?legSwing*0.5:0)+1,2.5*S,7*S,skin);
    px(ctx,baseX+7*S,armY-(moving?legSwing*0.5:0)+1,2.5*S,7*S,skin);
  }
  // neck + head
  const headY=torsoY-14*S;
  px(ctx,baseX-2*S,headY+12*S,4*S,4*S,skin);
  px(ctx,baseX-7*S,headY,14*S,14*S,outline);
  px(ctx,baseX-6*S,headY+1,12*S,12*S,skin);
  // ears
  px(ctx,baseX-8*S,headY+6*S,2*S,3*S,skin);
  px(ctx,baseX+6*S,headY+6*S,2*S,3*S,skin);
  // eyes
  const blink = (Math.floor(t*0.7+char.avatarSeed)%19)===0;
  if(blink){ px(ctx,baseX-4*S,headY+6*S,2*S,1*S,eye); px(ctx,baseX+2*S,headY+6*S,2*S,1*S,eye); }
  else { px(ctx,baseX-4.5*S,headY+5*S,2*S,2*S,eye); px(ctx,baseX+2.5*S,headY+5*S,2*S,2*S,eye); }
  px(ctx,baseX-4*S,headY+5*S,0.8*S,0.8*S,'#fffaf0'); px(ctx,baseX+3*S,headY+5*S,0.8*S,0.8*S,'#fffaf0');
  // nose/mouth
  px(ctx,baseX-0.5*S,headY+8*S,1*S,1*S,darken(skin,30));
  const emo=char.getEmotion?char.getEmotion():'feliz';
  if(['triste','irritado'].includes(emo)) px(ctx,baseX-2*S,headY+10*S,4*S,1*S,darken(skin,60));
  else px(ctx,baseX-2*S,headY+10*S,4*S,1*S,'#8d3c3c');
  // hair styles
  switch(style){
    case 'careca': break;
    case 'curto':
      px(ctx,baseX-7*S,headY-1,14*S,4*S,hair);
      px(ctx,baseX-7*S,headY+2*S,3*S,5*S,hair);
      px(ctx,baseX+4*S,headY+2*S,3*S,5*S,hair);
      break;
    case 'franja':
      px(ctx,baseX-7.5*S,headY-1,15*S,5*S,hair);
      px(ctx,baseX-6*S,headY+3*S,12*S,2*S,hair);
      break;
    case 'cacheado':
      px(ctx,baseX-8*S,headY-2,16*S,5*S,hair);
      for(let i=0;i<4;i++){ px(ctx,baseX-8*S+i*4.2*S,headY+1,4*S,3*S,hair); px(ctx,baseX-8*S+i*4.2*S,headY+2*S,3*S,4*S,hair); }
      break;
    case 'longo':
      px(ctx,baseX-8*S,headY-2,16*S,5*S,hair);
      px(ctx,baseX-9*S,headY+2*S,3*S,14*S,hair);
      px(ctx,baseX+6*S,headY+2*S,3*S,14*S,hair);
      break;
    case 'coque':
      px(ctx,baseX-7*S,headY-2,14*S,5*S,hair);
      px(ctx,baseX-3*S,headY-7*S,7*S,5*S,hair);
      px(ctx,baseX-7*S,headY+2*S,2*S,4*S,hair);
      break;
    case 'moicano':
      px(ctx,baseX-2*S,headY-6*S,5*S,7*S,hair);
      px(ctx,baseX-7*S,headY+1*S,14*S,2*S,hair);
      break;
    case 'chanel':
      px(ctx,baseX-8*S,headY-1,16*S,5*S,hair);
      px(ctx,baseX-9*S,headY+2*S,4*S,8*S,hair);
      px(ctx,baseX+5*S,headY+2*S,4*S,8*S,hair);
      px(ctx,baseX-6*S,headY+1*S,12*S,2*S,hair);
      break;
    case 'maria':
      px(ctx,baseX-7*S,headY-1,14*S,4*S,hair);
      px(ctx,baseX-11*S,headY+4*S,4*S,6*S,hair);
      px(ctx,baseX+7*S,headY+4*S,4*S,6*S,hair);
      break;
    default:
      px(ctx,baseX-7*S,headY-1,14*S,4*S,hair);
  }
  if(state==='workout'){
    // tiny dumbbell
    px(ctx,baseX+11*S,armY-3*S,8*S,2*S,'#3d3d46'); px(ctx,baseX+12*S,armY-5*S,2*S,6*S,'#666677');
  }
  if(state==='eat'){
    px(ctx,baseX+8*S,armY+2*S,4*S,3*S,'#f0bf62');
  }
  if(state==='paint'){
    px(ctx,baseX+8*S,armY-1*S,3*S,8*S,'#a77a4e'); px(ctx,baseX+10*S,armY-2*S,2*S,2*S,'#d85959');
  }
}

/* ---------- Portrait helper for UI / creator ---------- */
function drawPortrait(canvas,char,opts={}){
  if(!canvas) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=canvas.clientWidth||canvas.width, h=canvas.clientHeight||canvas.height;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr); }
  const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const S=Math.min(w/52,h/62);
  ctx.save(); ctx.translate(w/2,h-3); ctx.scale(S,S);
  drawPersonArt(ctx,0,0,char,{scale:opts.hideBody?1.6:1.85,state:opts.state||'idle',time:opts.time||1.1,shadow:false});
  ctx.restore();
}
class Renderer {
  constructor(canvas){
    this.canvas=canvas;
    this.ctx=canvas.getContext('2d');
    this.camera=new Camera();
    this.game=null;
    this.dpr=1; this.width=0; this.height=0;
    this.time=0;
    this.gestureDirty=true;
    this.rain=[]; this.lightning=0; this.lastHour=-1;
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    window.addEventListener('orientationchange',()=>setTimeout(()=>this.resize(),200));
  }
  attachGame(game){
    this.game=game; this.camera.viewW=this.width; this.camera.viewH=this.height;
    this.camera.zoom=clamp(this.width/390*1.05,0.72,1.3); this.camera.targetZoom=this.camera.zoom;
    this.focusCharacter(game.selected,true);
  }
  resize(){
    const rect=this.canvas.getBoundingClientRect();
    this.dpr=Math.min(2,window.devicePixelRatio||1);
    this.width=Math.max(200,rect.width); this.height=Math.max(300,rect.height);
    this.canvas.width=Math.round(this.width*this.dpr); this.canvas.height=Math.round(this.height*this.dpr);
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.ctx.imageSmoothingEnabled=false;
    this.camera.viewW=this.width; this.camera.viewH=this.height;
    if(this.game?.selected) this.camera.clamp(this.game.currentLot);
  }
  focusCharacter(char,instant=false){
    if(!char) return;
    this.camera.follow=true;
    this.camera.x=char.x; this.camera.y=char.y-0.2;
    if(instant) this.camera.clamp(this.game?.currentLot);
  }
  zoom(factor){ this.camera.zoomBy(factor,this.width/2,this.height/2); this.camera.follow=false; this.gestureDirty=true; }
  recenter(){ this.focusCharacter(this.game?.selected,true); this.gestureDirty=true; }
  update(dt){
    this.time+=dt;
    if(this.game?.selected) this.camera.update(dt,this.game.selected,this.game.currentLot);
    else this.camera.update(dt,null,this.game?.currentLot);
    this.updateWeather(dt);
    this.render();
  }
  updateWeather(dt){
    const weather=this.game?.weather||'sun';
    const want=weather==='rain'||weather==='storm'?90:weather==='cold'?34:0;
    while(this.rain.length<want) this.rain.push({x:rand(0,this.width),y:rand(-this.height,this.height),speed:rand(280,520),size:rand(7,16),drift:rand(-1,1)});
    if(this.rain.length>want) this.rain.length=want;
    this.rain.forEach(r=>{ r.y+=r.speed*dt; r.x+=r.drift*60*dt+(weather==='storm'?80*dt:0); if(r.y>this.height+20){r.y=-20;r.x=rand(0,this.width);} if(r.x>this.width+20)r.x=-20; });
    if(weather==='storm' && chance(dt*0.08)) this.lightning=0.25;
    if(this.lightning>0) this.lightning=Math.max(0,this.lightning-dt*2.5);
  }

  render(){
    const ctx=this.ctx, g=this.game;
    if(!g) return;
    const lot=g.currentLot;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.fillStyle='#15131d'; ctx.fillRect(0,0,this.width,this.height);
    const shake=this.camera.shake?rand(-1,1)*this.camera.shake:0;
    ctx.save();
    ctx.translate(this.width/2+shake,this.height/2+shake);
    ctx.scale(this.camera.zoom,this.camera.zoom);
    ctx.translate(-this.camera.x*TILE,-this.camera.y*TILE);
    this.drawGround(lot);
    this.drawFloors(lot);
    if(g.mode==='build'||g.mode==='buy') this.drawGridOverlay(lot);
    this.drawFloorObjects(lot);
    this.drawScene(lot,g);
    this.drawBuildGhost(g);
    this.drawOverlayBubbles(g);
    ctx.restore();
    this.drawLighting(lot,g);
    this.drawWeather();
    this.drawScreenVignette(g);
  }

  drawGround(lot){
    const ctx=this.ctx;
    const zoom=this.camera.zoom;
    const startX=Math.floor(this.camera.x-this.width/2/(TILE*zoom))-2;
    const endX=Math.ceil(this.camera.x+this.width/2/(TILE*zoom))+2;
    const startY=Math.floor(this.camera.y-this.height/2/(TILE*zoom))-2;
    const endY=Math.ceil(this.camera.y+this.height/2/(TILE*zoom))+2;
    for(let y=startY;y<=endY;y++)for(let x=startX;x<=endX;x++){
      if(x>=0&&y>=0&&x<lot.w&&y<lot.h) continue;
      const tx=x*TILE,ty=y*TILE;
      const h=hash2(x+99,y+33);
      ctx.fillStyle=h>0.5?'#243f31':'#203a2d';
      ctx.fillRect(tx,ty,TILE,TILE);
      if(h>0.82){ px(ctx,tx+7,ty+20,3,7,'#315c40'); px(ctx,tx+12,ty+15,2,6,'#2a5038'); }
      if(h<0.08){ px(ctx,tx+14,ty+10,5,5,'#385d45'); px(ctx,tx+10,ty+16,3,3,'#385d45'); }
    }
    // lot border
    ctx.strokeStyle='rgba(17,28,22,.55)'; ctx.lineWidth=3;
    ctx.strokeRect(1.5,1.5,lot.w*TILE-3,lot.h*TILE-3);
    ctx.strokeStyle='rgba(255,244,216,.08)'; ctx.lineWidth=1;
    ctx.strokeRect(4.5,4.5,lot.w*TILE-9,lot.h*TILE-9);
  }
  drawFloors(lot){
    for(let y=0;y<lot.h;y++)for(let x=0;x<lot.w;x++) this.drawFloorTile(x,y,lot.floorTypeAt(x,y));
  }
  drawFloorTile(x,y,type){
    const ctx=this.ctx, tx=x*TILE, ty=y*TILE, h=hash2(x,y);
    switch(type){
      case 'wood':{
        ctx.fillStyle=h>0.5?'#bd865a':'#b77f55'; ctx.fillRect(tx,ty,TILE,TILE);
        px(ctx,tx,ty+7,TILE,1,'rgba(83,49,31,.24)'); px(ctx,tx,ty+17,TILE,1,'rgba(83,49,31,.2)'); px(ctx,tx,ty+27,TILE,1,'rgba(83,49,31,.18)');
        px(ctx,tx+6+(h*18|0),ty+10,10,1,'rgba(255,220,170,.16)');
        px(ctx,tx,ty,TILE,1,'rgba(255,220,170,.06)');
        break;
      }
      case 'kitchen':{
        const alt=(x+y)%2===0; ctx.fillStyle=alt?'#d8c8a3':'#b9c9a9'; ctx.fillRect(tx,ty,TILE,TILE);
        px(ctx,tx+1,ty+1,TILE-2,1,'rgba(255,255,255,.2)'); px(ctx,tx,ty+31,TILE,1,'rgba(75,72,55,.15)');
        if(alt) px(ctx,tx+6,ty+6,2,2,'#c3b48f');
        break;
      }
      case 'tile':{
        ctx.fillStyle='#dce5da'; ctx.fillRect(tx,ty,TILE,TILE);
        px(ctx,tx+1,ty+1,TILE-2,TILE-2,'#e6ede4');
        ctx.strokeStyle='#c3cfc6'; ctx.lineWidth=1; ctx.strokeRect(tx+1.5,ty+1.5,TILE-3,TILE-3);
        if(h>0.7) px(ctx,tx+22,ty+22,2,2,'#bac8bf');
        break;
      }
      case 'concrete':{
        ctx.fillStyle=h>0.5?'#9da49f':'#989f9a'; ctx.fillRect(tx,ty,TILE,TILE);
        if(h>0.8) px(ctx,tx+8,ty+12,7,1,'#7f8781');
        break;
      }
      case 'sand':{
        ctx.fillStyle=h>0.5?'#e5ca88':'#ddc07b'; ctx.fillRect(tx,ty,TILE,TILE);
        if(h>0.6) px(ctx,tx+7+h*16,ty+9+h*12,2,2,'#b99c60');
        if(h<0.18) px(ctx,tx+20,ty+23,5,2,'#f1dca1');
        break;
      }
      case 'dark':{
        ctx.fillStyle=h>0.5?'#251d33':'#2a2139'; ctx.fillRect(tx,ty,TILE,TILE);
        px(ctx,tx,ty,TILE,1,'rgba(128,94,160,.08)');
        break;
      }
      case 'dance':{
        const alt=(x+y)%2===0;
        ctx.fillStyle=alt?'#392b4b':'#2d233d'; ctx.fillRect(tx,ty,TILE,TILE);
        if(alt){ px(ctx,tx+3,ty+3,TILE-6,1,'rgba(255,111,161,.28)'); px(ctx,tx+3,ty+28,TILE-6,1,'rgba(115,223,180,.18)'); }
        break;
      }
      case 'water':{
        const wave=Math.sin(this.time*1.8+x*.8+y*.6)*3;
        ctx.fillStyle='#4f9cae'; ctx.fillRect(tx,ty,TILE,TILE);
        px(ctx,tx+4,ty+8+wave,12,2,'rgba(203,246,245,.4)');
        px(ctx,tx+17,ty+21-wave,10,2,'rgba(203,246,245,.28)');
        px(ctx,tx,ty,TILE,2,'rgba(30,80,100,.22)');
        break;
      }
      case 'path':{
        ctx.fillStyle=h>0.5?'#b3a17e':'#a99876'; ctx.fillRect(tx,ty,TILE,TILE);
        ctx.strokeStyle='rgba(80,65,50,.3)'; ctx.lineWidth=1; ctx.strokeRect(tx+2.5,ty+2.5,TILE-5,TILE-5);
        break;
      }
      default:{
        ctx.fillStyle=h>0.55?'#6ea76a':'#69a065'; ctx.fillRect(tx,ty,TILE,TILE);
        const n=k=>hash2(x*7+k,y*11+k);
        if(n(1)>0.58){ px(ctx,tx+5+n(2)*18,ty+8+n(3)*15,2,5,'#4f8d56'); px(ctx,tx+7+n(2)*18,ty+7+n(3)*15,2,3,'#58995e'); }
        if(n(4)>0.78){ px(ctx,tx+22,ty+24,3,2,'#8fc078'); }
        if(n(5)>0.86){ px(ctx,tx+10,ty+14,3,3,'#e8d16c'); px(ctx,tx+11,ty+13,1,1,'#fff0a5'); }
        px(ctx,tx,ty+31,TILE,1,'rgba(47,96,52,.13)');
      }
    }
  }
  drawFloorObjects(lot){
    const walkables=lot.objects.filter(o=>objDef(o).walkable).sort((a,b)=>(a.y+0.01)-(b.y+0.01));
    walkables.forEach(o=>this.drawFurniture(o,true));
  }
  drawScene(lot,game){
    const drawables=[];
    lot.walls.forEach(w=>drawables.push({type:'wall',d:(w.y+1)*TILE-2,o:w}));
    lot.objects.filter(o=>!objDef(o).walkable).forEach(o=>drawables.push({type:'obj',d:(o.y+o.h)*TILE-2,o}));
    game.characters.forEach(c=>{
      if(c.hidden) return;
      let d=c.y*TILE+15, o={char:c};
      if(c.action && c.action.anim==='sleep'){
        const target=lot.objects.find(x=>x.uid===c.action.targetUid);
        if(target){ o.sleepTarget=target; d=(target.y+target.h)*TILE-1; }
      }
      drawables.push({type:'char',d,o});
    });
    (game.npcs||[]).forEach(c=>{ if(!c.hidden) drawables.push({type:'char',d:c.y*TILE+15,o:{char:c}}); });
    (game.pets||[]).forEach(p=>{ if(!p.hidden) drawables.push({type:'pet',d:p.y*TILE+13,o:p}); });
    drawables.sort((a,b)=>a.d-b.d || (a.type==='wall'?-1:1));
    drawables.forEach(item=>{
      if(item.type==='wall') this.drawWall(item.o);
      else if(item.type==='obj') this.drawFurniture(item.o,false);
      else if(item.type==='pet') this.drawPet(item.o);
      else {
        const c=item.o.char;
        if(item.o.sleepTarget){
          const t=item.o.sleepTarget;
          const sx=(t.x+t.w/2)*TILE, sy=(t.y+t.h*0.58)*TILE;
          drawPersonArt(this.ctx,sx,sy,c,{state:'sleep',scale:c.stageInfo.id==='bebe'?0.9:1.08,time:this.time,shadow:false});
          this.drawZzz(sx+18,sy-18);
        } else {
          const state=c.moving?'walk':(c.action?.anim||'idle');
          drawPersonArt(this.ctx,c.x*TILE,c.y*TILE+12,c,{state,walking:c.moving,walk:c.walkPhase,time:this.time});
          if(c.action && state==='shower'){
            for(let i=0;i<3;i++) px(this.ctx,c.x*TILE-8+i*7,c.y*TILE-34+Math.sin(this.time*4+i)*5,3,3,'rgba(210,245,250,.5)');
          }
        }
      }
    });
    this.drawCharacterLabels(game);
  }
  drawCharacterLabels(game){
    const ctx=this.ctx;
    [...game.characters,...(game.npcs||[])].forEach(c=>{
      if(c.hidden) return;
      const isSel=c.id===game.selectedId;
      const isNpc=c.isNPC;
      if(!isSel && !isNpc) return;
      const x=c.x*TILE, y=c.y*TILE-39;
      const label=c.name;
      ctx.font='bold 8px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const tw=Math.max(28,ctx.measureText(label).width+10);
      ctx.fillStyle=isSel?'rgba(35,123,126,.9)':'rgba(40,31,52,.72)';
      ctx.fillRect(x-tw/2,y-7,tw,13);
      ctx.fillStyle=isSel?'#fff4d8':'#d5c6e4'; ctx.fillText(label,x,y);
      if(isSel){
        ctx.strokeStyle='rgba(255,209,102,.8)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.ellipse(x,c.y*TILE+12,13,5,0,0,Math.PI*2); ctx.stroke();
      }
    });
  }
  drawOverlayBubbles(game){
    [...game.characters,...(game.npcs||[])].forEach(c=>{
      if(c.hidden) return;
      if(c.speech){
        this.drawSpeech(c.x*TILE,c.y*TILE-48,c.speech,c.id===game.selectedId);
      } else if(c.thought && (c.id===game.selectedId || c.isNPC)){
        this.drawThought(c.x*TILE,c.y*TILE-45,c.thought);
      }
    });
  }
  roundedRect(ctx,x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
  }
  drawSpeech(x,y,text,selected){
    const ctx=this.ctx;
    ctx.font='bold 9px "Trebuchet MS",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    const max=135;
    const words=String(text).split(' '); const lines=[]; let line='';
    words.forEach(w=>{ const test=line?line+' '+w:w; if(ctx.measureText(test).width>max-14&&line){lines.push(line);line=w;} else line=test; });
    if(line)lines.push(line);
    const w=Math.max(42,Math.min(max,Math.max(...lines.map(l=>ctx.measureText(l).width))+14));
    const h=lines.length*11+10;
    ctx.fillStyle='rgba(15,11,22,.2)'; ctx.fillRect(x-w/2+2,y+2,w,h);
    this.roundedRect(ctx,x-w/2,y,w,h,6,selected?'#fff4d8':'#fff7e5','#33253f');
    px(ctx,x-3,y+h,6,5,selected?'#fff4d8':'#fff7e5');
    ctx.fillStyle='#2c213a';
    lines.forEach((l,i)=>ctx.fillText(l,x,y+5+i*11));
  }
  drawThought(x,y,icon){
    const ctx=this.ctx;
    ctx.fillStyle='rgba(255,244,216,.94)';
    ctx.beginPath(); ctx.ellipse(x,y,12,10,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(43,32,54,.55)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x+1,y+13,6,4.5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x-8,y+18,2.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#2b2038'; ctx.fillText(icon,x,y+1);
  }
  drawZzz(x,y){
    const ctx=this.ctx; ctx.font='bold 10px monospace'; ctx.fillStyle='rgba(255,244,216,.8)';
    const bob=Math.sin(this.time*2)*3;
    ctx.fillText('z',x+Math.sin(this.time)*2,y+bob); ctx.font='bold 7px monospace';ctx.fillText('z',x+8,y+10+bob);
  }
  drawPet(pet){
    const ctx=this.ctx,x=pet.x*TILE,y=pet.y*TILE+10;
    ctx.fillStyle='rgba(20,15,25,.22)'; ctx.beginPath(); ctx.ellipse(x,y,9,3.5,0,0,Math.PI*2); ctx.fill();
    const color=pet.species==='cat'?'#c08a5a':'#c18c57';
    if(pet.species==='cat'){
      px(ctx,x-7,y-8,14,9,'#3a2830'); px(ctx,x-6,y-7,12,7,color);
      px(ctx,x-7,y-14,7,7,'#3a2830'); px(ctx,x-6,y-13,6,6,color);
      px(ctx,x-6,y-16,2,4,color); px(ctx,x-1,y-16,2,4,color);
      px(ctx,x+5,y-4,3,8,color); px(ctx,x+6,y-10,2,7,color);
      px(ctx,x-4,y-11,1,1,'#2a1d25'); px(ctx,x-1,y-11,1,1,'#2a1d25');
    } else {
      px(ctx,x-8,y-9,16,10,'#3a2830'); px(ctx,x-7,y-8,14,8,color);
      px(ctx,x+1,y-16,7,8,'#3a2830'); px(ctx,x+2,y-15,6,6,color);
      px(ctx,x+2,y-18,2,4,'#6b4831'); px(ctx,x+6,y-18,2,4,'#6b4831');
      px(ctx,x-9,y-12,3,7,color); px(ctx,x+7,y-12,2,5,color);
      px(ctx,x+2,y-12,1,1,'#24181d'); px(ctx,x+5,y-12,1,1,'#24181d');
      px(ctx,x+4,y-10,2,1,'#24181d');
    }
    const mood=pet.mood;
    if(mood==='triste') { ctx.font='8px sans-serif'; ctx.textAlign='center'; ctx.fillText('💧',x,y-22); }
  }

  /* ---------- Walls ---------- */
  drawWall(w){
    const ctx=this.ctx,x=w.x*TILE,y=w.y*TILE;
    const base=w.color||'#d2b386';
    if(w.type==='door'){
      px(ctx,x+4,y+28,TILE-8,3,'rgba(32,22,35,.22)');
      px(ctx,x+3,y+4,TILE-6,TILE-4,'#6d523b');
      px(ctx,x+6,y+6,TILE-12,TILE-6,'#463525');
      px(ctx,x+8,y+8,TILE-16,TILE-9,'#2b211c');
      px(ctx,x+9,y+29,TILE-18,3,'#b98b5c');
      px(ctx,x+TILE-8,y+12,2,4,'#d7b273');
      return;
    }
    px(ctx,x+2,y+10,TILE-4,TILE-8,'rgba(26,18,29,.22)');
    px(ctx,x,y+6,TILE,TILE-12,darken(base,26));
    px(ctx,x+2,y+7,TILE-4,TILE-14,base);
    px(ctx,x+2,y+7,TILE-4,7,lighten(base,22));
    px(ctx,x+2,y+14,TILE-4,2,darken(base,12));
    // brick texture
    px(ctx,x+7,y+18,12,1,darken(base,30)); px(ctx,x+22,y+25,8,1,darken(base,24));
    if(w.type==='window'){
      px(ctx,x+5,y+10,TILE-10,17,'#5c7278');
      px(ctx,x+7,y+12,TILE-14,13,'#8cccd8');
      px(ctx,x+7,y+12,TILE-14,5,'#b9e8ec');
      px(ctx,x+TILE/2-1,y+12,2,13,'#e7f7f0');
      px(ctx,x+8,y+18,TILE-16,1,'#e7f7f0');
      px(ctx,x+7,y+12,5,3,'rgba(255,255,255,.45)');
    }
    // wall top trim
    px(ctx,x+1,y+5,TILE-2,3,lighten(base,42));
    px(ctx,x+1,y+8,TILE-2,1,darken(base,20));
  }

  /* ---------- Furniture ---------- */
  drawFurniture(o,flat=false){
    const ctx=this.ctx, def=objDef(o), x=o.x*TILE, y=o.y*TILE, w=o.w*TILE, h=o.h*TILE;
    const col=o.color||def.color||'#b58c68';
    if(def.walkable){
      if(def.kind==='rug') this.drawRug(o);
      else if(def.kind==='tapete') this.drawRug(o);
      return;
    }
    if(!flat){
      ctx.fillStyle='rgba(25,17,27,.2)';
      ctx.beginPath(); ctx.ellipse(x+w/2,y+h-4,w*0.42,5,0,0,Math.PI*2); ctx.fill();
    }
    if(o.broken){
      px(ctx,x+5,y+5,3,3,'#5d4c4d');
      px(ctx,x+w-9,y+h*0.35,4,2,'#5d4c4d'); px(ctx,x+w-6,y+h*0.35-3,2,7,'#5d4c4d');
    }
    switch(def.kind){
      case 'fridge':
        px(ctx,x+5,y+3,w-10,h-6,'#56636a'); px(ctx,x+6,y+4,w-12,h-8,col);
        px(ctx,x+6,y+4,w-12,2,'#f1f6f2'); px(ctx,x+w/2,y+24,1,h-29,'#9cb1ae');
        px(ctx,x+w-12,y+17,3,12,'#7d8f8d'); px(ctx,x+w-12,y+34,3,9,'#7d8f8d');
        break;
      case 'stove':
        px(ctx,x+4,y+4,w-8,h-8,'#57565a'); px(ctx,x+5,y+5,w-10,h-10,col);
        px(ctx,x+7,y+8,w-14,12,'#282a2d');
        for(let i=0;i<4;i++){ ctx.strokeStyle='#6a6a6d';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+12+(i%2)*10,y+12+Math.floor(i/2)*6,3,0,Math.PI*2);ctx.stroke(); }
        px(ctx,x+8,y+23,w-16,8,'#8b8d88'); px(ctx,x+10,y+25,w-20,4,'#3a3739');
        px(ctx,x+8,y+35,2,2,'#e2d6a8'); px(ctx,x+12,y+35,2,2,'#e2d6a8'); px(ctx,x+16,y+35,2,2,'#e2d6a8');
        break;
      case 'microwave':
        px(ctx,x+5,y+7,w-10,h-15,'#5d5f63'); px(ctx,x+6,y+8,w-12,h-17,col);
        px(ctx,x+8,y+10,w-20,10,'#3e4b51'); px(ctx,x+w-10,y+9,3,3,'#d8e4df');
        px(ctx,x+8,y+24,w-16,1,'#777');
        break;

        px(ctx,x+11,y+9,6,4,'#f0d18a'); px(ctx,x+20,y+14,5,5,'#587d86');
        break;
      case 'sculpture':
        px(ctx,x+12,y+17,8,8,'#8e7c6d'); px(ctx,x+10,y+9,7,9,'#b0a18e'); px(ctx,x+17,y+12,6,6,'#998978'); px(ctx,x+18,y+5,4,7,'#c4b4a0');
        break;
      case 'decor':
        px(ctx,x+9,y+13,w-18,12,'#8b6049'); px(ctx,x+11,y+10,w-22,4,'#c58f65');
        px(ctx,x+11,y+5,2,7,'#5c8c5a'); px(ctx,x+14,y+4,4,4,'#d87b8e');
        break;
      case 'fountain':
        ctx.fillStyle='#8ba6a8';ctx.beginPath();ctx.ellipse(x+w/2,y+h/2+10,w/2-4,h/2-4,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#6fc1cb';ctx.beginPath();ctx.ellipse(x+w/2,y+h/2+10,w/2-10,h/2-10,0,0,Math.PI*2);ctx.fill();
        px(ctx,x+w/2-3,y+23,6,19,'#a7b7b2');
        ctx.fillStyle='#9dcfd2';ctx.beginPath();ctx.ellipse(x+w/2,y+20,12,4,0,0,Math.PI*2);ctx.fill();
        for(let i=0;i<5;i++) px(ctx,x+w/2-4+i*2,y+4+Math.sin(this.time*3+i)*3,1,11,'rgba(194,244,247,.6)');
        break;
      case 'swing':
        px(ctx,x+5,y+4,3,h-5,'#76533e'); px(ctx,x+w-8,y+4,3,h-5,'#76533e'); px(ctx,x+5,y+4,w-10,3,'#8d664a');
        px(ctx,x+w/2-6,y+10,12,3,'#c98c66'); px(ctx,x+w/2-5,y+13,1,10,'#7b5a44'); px(ctx,x+w/2+4,y+13,1,10,'#7b5a44');
        break;
      case 'playhouse':
        px(ctx,x+5,y+9,w-10,h-12,'#b97762'); px(ctx,x+3,y+9,w-6,5,'#8f4f4b');
        px(ctx,x+10,y+17,8,h-20,'#5d4939'); px(ctx,x+w-20,y+14,8,8,'#ffe08a');
        px(ctx,x+w/2-4,y+3,8,7,'#8f4f4b');
        break;
      case 'toy':
        px(ctx,x+12,y+18,8,8,'#d98f6f'); px(ctx,x+10,y+15,4,5,'#b7745c'); px(ctx,x+19,y+15,4,5,'#b7745c');
        px(ctx,x+14,y+20,2,2,'#33262e'); px(ctx,x+18,y+20,2,2,'#33262e');
        break;
      case 'petbed':
        ctx.fillStyle='#8b6472';ctx.beginPath();ctx.ellipse(x+w/2,y+22,12,7,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#d5a4ad';ctx.beginPath();ctx.ellipse(x+w/2,y+21,9,5,0,0,Math.PI*2);ctx.fill();
        break;
      case 'petbowl':
        px(ctx,x+7,y+19,8,6,'#7a99a1'); px(ctx,x+18,y+19,7,6,'#b18c69'); px(ctx,x+9,y+20,4,1,'#d4d0a1'); px(ctx,x+20,y+20,3,1,'#a46048');
        break;
      case 'pettoy':
        ctx.fillStyle='#d9b85e';ctx.beginPath();ctx.arc(x+w/2,y+22,5,0,Math.PI*2);ctx.fill(); px(ctx,x+15,y+18,2,2,'#fff0a0');
        break;
      case 'scratchingpost':
        px(ctx,x+14,y+21,4,9,'#b19272'); px(ctx,x+12,y+5,8,17,'#c0a07b'); px(ctx,x+10,y+13,12,3,'#8f7258');
        break;
      case 'pethouse':
        px(ctx,x+4,y+11,w-8,h-14,'#a8795d'); px(ctx,x+2,y+11,w-4,4,'#7c5141'); px(ctx,x+9,y+18,10,h-21,'#4a3833');
        px(ctx,x+w/2-7,y+7,14,5,'#7c5141');
        break;
      case 'lounger':
        px(ctx,x+4,y+15,w-8,3,'#e5b85d'); px(ctx,x+5,y+17,3,11,'#bf8e47'); px(ctx,x+w-8,y+17,3,11,'#bf8e47');
        px(ctx,x+5,y+9,w-10,7,'#f0cb79'); px(ctx,x+6,y+10,w-12,2,'#ffe5a7');
        break;
      default:{
        // generic furniture crate with category color and tiny emblem
        const catCol=col;
        px(ctx,x+4,y+7,w-8,h-11,darken(catCol,28));
        px(ctx,x+5,y+8,w-10,h-13,catCol);
        px(ctx,x+7,y+10,w-14,3,lighten(catCol,25));
        px(ctx,x+w/2-2,y+h/2-2,4,4,darken(catCol,55));
        break;
      }
    }
    this.drawObjectState(o,x,y,w,h,def);
  }
  drawRug(o){
    const ctx=this.ctx,def=objDef(o),x=o.x*TILE+3,y=o.y*TILE+5,w=o.w*TILE-6,h=o.h*TILE-8;
    const col=o.color||def.color||'#aa896d';
    ctx.fillStyle=darken(col,25);ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2-4,h/2-4,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=lighten(col,30);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2-9,h/2-7,0,0,Math.PI*2);ctx.stroke();
    px(ctx,x+w/2-3,y+h/2-2,6,4,lighten(col,18));
  }
  drawObjectState(o,x,y,w,h,def){
    if(o.dirty>55){
      for(let i=0;i<3;i++){ const t=this.time*2+i*2; px(this.ctx,x+8+Math.sin(t)*5+i*5,y+8+Math.cos(t)*3,2,2,'#c9c46f'); }
      px(this.ctx,x+5,y+h-6,3,1,'rgba(111,129,67,.4)');
    }
    if(o.burning){
      for(let i=0;i<5;i++){
        const fx=x+8+i*(w-16)/5, fy=y+3+Math.sin(this.time*5+i)*4;
        px(this.ctx,fx,fy,5,10,'#e35e3d'); px(this.ctx,fx+1,fy+3,3,7,'#ff9b4a'); px(this.ctx,fx+2,fy,1,3,'#ffe57a');
        this.ctx.fillStyle='rgba(255,190,90,.12)';this.ctx.beginPath();this.ctx.arc(fx+2,fy,16,0,Math.PI*2);this.ctx.fill();
      }
    }
    if(o.upgraded>0){
      for(let i=0;i<o.upgraded;i++) px(this.ctx,x+w-7-i*3,y+3,2,2,'#ffe082');
    }
    if(o.lit && ['lamp','chandelier','candles','stringlights','fireplace'].includes(def.kind)){
      this.ctx.fillStyle='rgba(255,210,110,.10)';this.ctx.beginPath();this.ctx.arc(x+w/2,y+h/2,24,0,Math.PI*2);this.ctx.fill();
    }
  }

  /* ---------- Build overlays ---------- */
  drawGridOverlay(lot){
    const ctx=this.ctx;
    ctx.strokeStyle='rgba(255,244,216,.11)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<=lot.w;x++){ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,lot.h*TILE);}
    for(let y=0;y<=lot.h;y++){ctx.moveTo(0,y*TILE);ctx.lineTo(lot.w*TILE,y*TILE);}
    ctx.stroke();
    ctx.fillStyle='rgba(115,223,180,.018)';ctx.fillRect(0,0,lot.w*TILE,lot.h*TILE);
  }
  drawBuildGhost(game){
    const ctx=this.ctx,ghost=game.ghost;
    if(game.mode==='buy'&&game.buySelection){
      const def=CATALOG_MAP[game.buySelection];
      if(def&&ghost){
        const check=game.canPlaceObject(def,ghost.x,ghost.y);
        ctx.fillStyle=check.ok?'rgba(115,223,180,.32)':'rgba(235,94,85,.35)';
        ctx.fillRect(ghost.x*TILE,ghost.y*TILE,def.w*TILE,def.h*TILE);
        ctx.strokeStyle=check.ok?'#73dfb4':'#ff7163';ctx.lineWidth=2;
        ctx.strokeRect(ghost.x*TILE+1,ghost.y*TILE+1,def.w*TILE-2,def.h*TILE-2);
      }
    } else if(game.mode==='build'&&ghost){
      const tool=game.buildTool;
      if(['wall','door','window'].includes(tool)){
        ctx.fillStyle='rgba(255,209,102,.3)';ctx.fillRect(ghost.x*TILE,ghost.y*TILE,TILE,TILE);
        ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.strokeRect(ghost.x*TILE+1,ghost.y*TILE+1,TILE-2,TILE-2);
      } else {
        ctx.fillStyle='rgba(115,223,180,.24)';ctx.fillRect(ghost.x*TILE,ghost.y*TILE,TILE,TILE);
        ctx.strokeStyle='#73dfb4';ctx.lineWidth=2;ctx.strokeRect(ghost.x*TILE+1,ghost.y*TILE+1,TILE-2,TILE-2);
      }
    }
  }

  /* ---------- Lighting / weather ---------- */
  drawLighting(lot,game){
    const ctx=this.ctx; const hour=game.time.minutes/60;
    let dark=0;
    if(hour<5) dark=.58; else if(hour<7) dark=lerp(.58,.05,(hour-5)/2); else if(hour<17.5) dark=.02;
    else if(hour<20) dark=lerp(.03,.55,(hour-17.5)/2.5); else dark=.58;
    if(game.weather==='storm') dark=Math.max(dark,.3);
    if(game.weather==='rain') dark=Math.max(dark,.16);
    if(dark<=0.025) return;
    ctx.save();
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    const grd=ctx.createLinearGradient(0,0,0,this.height);
    grd.addColorStop(0,`rgba(20,25,62,${dark})`); grd.addColorStop(1,`rgba(8,10,32,${dark*0.82})`);
    ctx.fillStyle=grd; ctx.fillRect(0,0,this.width,this.height);
    // warm light pools
    ctx.globalCompositeOperation='lighter';
    lot.objects.filter(o=>o.lit && ['lamp','chandelier','candles','stringlights','fireplace','fogao','churrasqueira','fogueira'].includes(objDef(o).kind)||o.burning).forEach(o=>{
      const p=this.camera.worldToScreen((o.x+o.w/2)*TILE,(o.y+o.h/2)*TILE);
      const radius=(o.burning?90:68)*this.camera.zoom;
      const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,radius);
      g.addColorStop(0,o.burning?'rgba(255,135,70,.34)':'rgba(255,205,115,.22)');
      g.addColorStop(1,'rgba(255,190,90,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();
    });
    if(game.worldWindowLight!==false){
      lot.walls.filter(w=>w.type==='window').forEach(w=>{
        const p=this.camera.worldToScreen((w.x+.5)*TILE,(w.y+.5)*TILE);
        const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,45*this.camera.zoom);
        g.addColorStop(0,'rgba(120,170,210,.06)');g.addColorStop(1,'rgba(80,120,180,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,45*this.camera.zoom,0,Math.PI*2);ctx.fill();
      });
    }
    ctx.restore();
  }
  drawWeather(){
    const ctx=this.ctx, weather=this.game?.weather;
    if(weather==='rain'||weather==='storm'){
      ctx.save();ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
      ctx.strokeStyle=weather==='storm'?'rgba(175,205,235,.42)':'rgba(180,215,235,.3)'; ctx.lineWidth=1;
      this.rain.forEach(r=>{ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-3,r.y+r.size);ctx.stroke();});
      if(this.lightning>0){ ctx.fillStyle=`rgba(220,235,255,${this.lightning*0.45})`;ctx.fillRect(0,0,this.width,this.height); }
      ctx.restore();
    }
    if(weather==='cold'){
      ctx.save();ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
      this.rain.forEach((r,i)=>{ctx.fillStyle='rgba(235,245,255,.42)';ctx.fillRect((r.x+Math.sin(this.time+i)*20)%this.width,(r.y+this.time*20+i*30)%this.height,2,2);});
      ctx.restore();
    }
  }
  drawScreenVignette(game){
    const ctx=this.ctx;
    ctx.save();ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    const g=ctx.createRadialGradient(this.width/2,this.height*.42,Math.min(this.width,this.height)*.35,this.width/2,this.height*.42,Math.max(this.width,this.height)*.75);
    g.addColorStop(0,'rgba(12,9,18,0)');g.addColorStop(1,'rgba(12,9,18,.34)');
    ctx.fillStyle=g;ctx.fillRect(0,0,this.width,this.height);
    ctx.restore();
  }
}


/* ===== input.js ===== */
/* ============================================================
   INPUT — touch, mouse, long-press, pinch, drag, build placement
   ============================================================ */

class Input {
  constructor(canvas,renderer,game){
    this.canvas=canvas; this.renderer=renderer; this.game=game;
    this.pointers=new Map();
    this.dragStart=null; this.dragLast=null; this.dragging=false;
    this.longTimer=null; this.longFired=false;
    this.pinchDist=0; this.pinchCenter=null;
    this.hover=null; this.paintTile=null; this.appliedDown=false;
    this.bind();
  }
  bind(){
    const c=this.canvas;
    c.addEventListener('pointerdown',e=>this.down(e),{passive:false});
    c.addEventListener('pointermove',e=>this.move(e),{passive:false});
    c.addEventListener('pointerup',e=>this.up(e),{passive:false});
    c.addEventListener('pointercancel',e=>this.up(e),{passive:false});
    c.addEventListener('contextmenu',e=>e.preventDefault());
    c.addEventListener('wheel',e=>{
      if(!this.game?.started) return;
      e.preventDefault();
      this.renderer.zoom(e.deltaY<0?1.12:0.89);
    },{passive:false});
    window.addEventListener('keydown',e=>{
      if(!this.game?.started) return;
      if(e.target && ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
      if(e.code==='Space'){ e.preventDefault(); this.game.toggleSpeedPause(); }
      if(e.code==='Digit1') this.game.setSpeed(1);
      if(e.code==='Digit2') this.game.setSpeed(2);
      if(e.code==='Digit3') this.game.setSpeed(3);
      if(e.code==='KeyC'){ if(this.game.ui) this.game.ui.openCharacterPanel('needs'); }
      if(e.code==='KeyB') this.game.setMode('buy');
      if(e.code==='KeyU') this.game.setMode('build');
      if(e.code==='KeyM') this.game.setMode('map');
      if(e.code==='KeyP') this.game.setMode('phone');
      if(e.code==='Escape'){ if(this.game.mode!=='live') this.game.exitBuild(); }
      if(e.code==='KeyZ'&&(e.ctrlKey||e.metaKey)) this.game.undoLast();
      if(e.code==='ArrowLeft'){this.renderer.camera.panBy(40,0);}
      if(e.code==='ArrowRight'){this.renderer.camera.panBy(-40,0);}
      if(e.code==='ArrowUp'){this.renderer.camera.panBy(0,40);}
      if(e.code==='ArrowDown'){this.renderer.camera.panBy(0,-40);}
    });
  }
  local(e){ const r=this.canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  world(e){ const p=this.local(e); return this.renderer.camera.screenToWorld(p.x,p.y); }
  tile(e){ const w=this.world(e); return {x:Math.floor(w.x),y:Math.floor(w.y)}; }
  down(e){
    if(!this.game?.started) return;
    e.preventDefault();
    this.game.audio.resume();
    try{ this.canvas.setPointerCapture(e.pointerId); }catch(err){}
    const p=this.local(e);
    this.pointers.set(e.pointerId,{...p,startX:p.x,startY:p.y,startTime:performance.now()});
    if(this.pointers.size===2){
      this.cancelLong();
      const pts=[...this.pointers.values()];
      this.pinchDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      this.pinchCenter={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
      return;
    }
    if(this.pointers.size>2) return;
    this.dragStart={...p}; this.dragLast={...p}; this.dragging=false; this.longFired=false;
    this.appliedDown=false;
    const t=this.tile(e); this.hover=t; this.updateGhost(t);
    this.cancelLong();
    this.longTimer=setTimeout(()=>{
      if(!this.dragging && this.pointers.size===1 && !this.longFired){
        this.longFired=true; this.handleLongPress(t.x,t.y);
        if(navigator.vibrate) try{navigator.vibrate(18);}catch(err){}
      }
    },470);
    if(this.game.mode==='build' && this.game.buildTool!=='paint'){
      this.paintTile=t; this.applyBuildAt(t); this.appliedDown=true;
    }
  }
  move(e){
    if(!this.game?.started) return;
    // Desktop: track the tile under the mouse even without a held button.
    if(e.pointerType==='mouse' && this.pointers.size===0){
      const t=this.tile(e); this.hover=t; this.updateGhost(t);
      return;
    }
    if(this.pointers.has(e.pointerId)){
      const p=this.local(e); const rec=this.pointers.get(e.pointerId);
      rec.x=p.x; rec.y=p.y;
    }
    if(this.pointers.size===2){
      e.preventDefault();
      const pts=[...this.pointers.values()];
      const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      const center={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
      if(this.pinchDist>0){
        const factor=clamp(dist/this.pinchDist,0.7,1.4);
        this.renderer.camera.zoomBy(factor,center.x,center.y);
      }
      this.pinchDist=dist; this.pinchCenter=center;
      return;
    }
    if(this.pointers.size!==1 || !this.dragStart) return;
    e.preventDefault();
    const p=this.local(e);
    const dx=p.x-this.dragLast.x, dy=p.y-this.dragLast.y;
    const total=Math.hypot(p.x-this.dragStart.x,p.y-this.dragStart.y);
    if(total>8){ this.dragging=true; this.renderer.camera.panBy(dx,dy); this.cancelLong(); }
    this.dragLast={...p};
    const t=this.tile(e); this.hover=t; this.updateGhost(t);
    if(this.game.mode==='build' && this.game.buildTool!=='paint' && this.appliedDown && total>5 &&
       (!this.paintTile || this.paintTile.x!==t.x || this.paintTile.y!==t.y)){
      this.paintTile=t; this.applyBuildAt(t);
    }
  }
  up(e){
    if(!this.game?.started) return;
    const rec=this.pointers.get(e.pointerId);
    this.pointers.delete(e.pointerId);
    this.cancelLong();
    if(this.pointers.size===1){
      const rem=[...this.pointers.values()][0];
      this.dragStart={x:rem.x,y:rem.y}; this.dragLast={x:rem.x,y:rem.y}; this.dragging=false;
    }
    if(this.pointers.size===0){
      this.pinchDist=0; this.pinchCenter=null;
      if(!rec) return;
      const p=this.local(e);
      const dist=Math.hypot(p.x-(rec.startX??rec.x),p.y-(rec.startY??rec.y));
      if(!this.dragging && !this.longFired && dist<12){
        if(this.game.mode==='build'){
          if(this.game.buildTool==='paint'){ this.applyBuildAt(this.tile(e)); }
          else if(!this.appliedDown){ this.applyBuildAt(this.tile(e)); }
        } else {
          this.tap(p.x,p.y);
        }
      }
      this.dragStart=null; this.dragLast=null; this.dragging=false; this.longFired=false; this.appliedDown=false;
    }
  }
  cancelLong(){ if(this.longTimer){clearTimeout(this.longTimer);this.longTimer=null;} }
  updateGhost(t){
    this.game.ghost={x:t.x,y:t.y};
    if(this.game.mode==='buy'||this.game.mode==='build') this.renderer.gestureDirty=true;
  }
  applyBuildAt(t){
    if(!this.game.currentLot.inBounds(t.x,t.y)) return;
    this.game.applyBuildTool(t.x,t.y);
  }
  tap(sx,sy){
    const w=this.renderer.camera.screenToWorld(sx,sy);
    const g=this.game, lot=g.currentLot;
    if(g.mode==='buy'){
      const defId=g.buySelection;
      if(!defId){ if(g.ui) g.ui.toast('Escolha um móvel no catálogo.','info'); return; }
      const def=CATALOG_MAP[defId];
      if(!def) return;
      g.placeObject(defId,Math.floor(w.x),Math.floor(w.y));
      return;
    }
    if(g.mode==='build'){ this.applyBuildAt({x:Math.floor(w.x),y:Math.floor(w.y)}); return; }
    if(g.mode!=='live') return;
    const pet=g.nearestPet(w.x,w.y,0.85);
    if(pet){ if(g.ui) g.ui.showPetMenu(pet); return; }
    const person=g.nearestCharacter(w.x,w.y,0.85);
    if(person){
      if(person.isNPC){ if(g.ui) g.ui.showSocialMenu(person); }
      else if(person.id!==g.selectedId){ g.selectCharacter(person.id); if(g.ui)g.ui.toast(`Controlando ${person.name}.`,'👤'); }
      else if(g.ui) g.ui.openCharacterPanel('needs');
      return;
    }
    const obj=g.nearestObjectAt(w.x,w.y,true);
    if(obj){
      g.selectedObjectUid=obj.uid;
      if(g.ui) g.ui.showObjectMenu(obj);
      return;
    }
    const tx=Math.floor(w.x),ty=Math.floor(w.y);
    if(lot.inBounds(tx,ty)) g.moveToTile(tx,ty);
  }
  handleLongPress(tx,ty){
    const g=this.game, lot=g.currentLot;
    if(g.mode==='buy'||g.mode==='build') return;
    const w={x:tx+0.5,y:ty+0.5};
    const pet=g.nearestPet(w.x,w.y,0.9);
    if(pet){ if(g.ui) g.ui.showPetMenu(pet); return; }
    const person=g.nearestCharacter(w.x,w.y,0.9);
    if(person){ if(g.ui) g.ui.showSocialMenu(person); return; }
    const obj=g.nearestObjectAt(tx,ty,true);
    if(obj){ if(g.ui) g.ui.showObjectMenu(obj); return; }
    if(lot.inBounds(tx,ty) && g.ui) g.ui.showTileMenu(tx,ty);
  }
}

/* ===== ui.js ===== */
/* ============================================================
   UI — HUD, menus, character sheet, phone, build, buy, creation
   ============================================================ */

const NEED_COLORS = v => v>62?'#73dfb4':v>34?'#ffd166':'#ff7163';
const ICON_FOR_CAT = c => CAT_MAP[c]?.icon||'📦';

class UI {
  constructor(game,renderer){
    this.game=game; this.renderer=renderer;
    this.modalRoot=$('#modalRoot'); this.creationRoot=$('#creationRoot');
    this.charTab='needs'; this.charPanelOpen=false;
    this.modalType=null;
    this.phoneApp='home'; this.buyCategory='sala'; this.buildTool='wall';
    this.buildColor='#d2b386'; this.buildFloor='wood';
    this.unread=0; this.lastNotifLen=0;
    this.creation=null; this.tutorialStep=0;
    this.partyEl=null; this.startVisible=true;
    this.bindStatic();
    this.createPartyBanner();
    this.refreshStart();
    this.attachGame(game);
  }
  attachGame(game){
    this.game=game;
    if(this.renderer) this.renderer.attachGame(game);
    this.refreshAll();
  }
  bindStatic(){
    $('#notifBtn').addEventListener('click',()=>this.showNotifications());
    $('#zoomIn').addEventListener('click',()=>this.renderer.zoom(1.16));
    $('#zoomOut').addEventListener('click',()=>this.renderer.zoom(0.86));
    $('#recenterBtn').addEventListener('click',()=>this.renderer.recenter());
    $('#portraitBtn').addEventListener('click',()=>this.openCharacterPanel('needs'));
    $('#charSummary').addEventListener('click',()=>this.openCharacterPanel('needs'));
    $('#needsToggle').addEventListener('click',()=>this.toggleNeeds());
    $$('#speedGroup button').forEach(btn=>btn.addEventListener('click',()=>{
      const s=Number(btn.dataset.speed);
      this.game.setSpeed(s);
      this.audioTick();
    }));
    $$('#modeBar button').forEach(btn=>btn.addEventListener('click',()=>{
      const mode=btn.dataset.mode;
      if(this.game.mode===mode) this.game.setMode('live');
      else this.game.setMode(mode);
      this.audioTick();
    }));
    $('#newGameBtn').addEventListener('click',()=>this.openCreation());
    $('#quickStartBtn').addEventListener('click',()=>{
      this.game.startQuickGame(); this.hideStart(); this.maybeTutorial();
    });
    $('#continueBtn').addEventListener('click',()=>{
      const latest=SaveSystem.latest();
      if(latest) this.loadSlot(latest.slot);
    });
    document.addEventListener('click',e=>{
      if(e.target?.closest('#startScreen .start-slot')) return;
    });
    $('#hud').addEventListener('touchstart',()=>{}, {passive:true});
  }
  audioTick(){ try{this.game.audio.resume(); this.game.audio.sfx('tap');}catch(e){} }
  createPartyBanner(){
    this.partyEl=document.createElement('div');
    this.partyEl.id='partyBanner'; this.partyEl.className='party-banner hidden';
    $('#app').appendChild(this.partyEl);
  }
  setStartChrome(show){
    this.startVisible=show;
    $('#topbar').classList.toggle('hidden',show);
    $('#hud').classList.toggle('hidden',show);
    $('#queueBar').classList.add('hidden');
    $('#zoomControls').classList.toggle('hidden',show);
    $('#startScreen').classList.toggle('hidden',!show);
  }
  hideStart(){ this.setStartChrome(false); }
  showStart(){ this.setStartChrome(true); this.refreshStart(); }
  refreshSaveSlots(){
    if(this.startVisible) this.refreshStart();
  }
  refreshStart(){
    const latest=SaveSystem.latest();    const cont=$('#continueBtn');
    if(latest){ cont.classList.remove('hidden'); cont.innerHTML=`▶ Continuar · ${escapeHtml(latest.meta?.name||'Sua família')}`; }
    else cont.classList.add('hidden');
    const list=$('#slotList');
    const slots=SaveSystem.list();
    list.innerHTML=slots.map(s=>{
      if(s.data){
        const meta=s.meta||{};
        return `<button class="start-slot" data-slot="${s.slot}"><span>💾</span><span><b>Espaço ${s.slot} · ${escapeHtml(meta.name||'Família')}</b><small>Dia ${meta.day||1} · ${formatMoney(meta.money||0)} · ${meta.family||1} morador(es)</small></span><span class="ss-play">Jogar</span></button>`;
      }
      return `<div class="start-slot empty"><span>▫️</span><span><b>Espaço ${s.slot}</b><small>Vazio — uma nova história cabe aqui.</small></span></div>`;
    }).join('');
    $$('.start-slot[data-slot]',list).forEach(btn=>btn.addEventListener('click',()=>this.loadSlot(Number(btn.dataset.slot))));
  }
  loadSlot(slot){
    const payload=SaveSystem.get(slot);
    if(!payload){ this.toast('Esse espaço está vazio.','error'); return; }
    if(this.game.loadPayload(payload)){
      this.hideStart(); this.closeAll(); this.game.setMode('live'); this.refreshAll();
      this.toast('Sua vida foi carregada. 💾','success');
    } else {
      this.toast('Não foi possível carregar esse save.','error');
    }
  }

  /* ---------- HUD ---------- */
  refreshAll(){
    this.refreshHUD(); this.refreshSpeed(); this.refreshQueue(); this.refreshNotifBadge(); this.refreshParty(); this.refreshModes();
    if(this.charPanelOpen) this.renderCharacterPanel(this.charTab,true);
    if(this.game.mode==='build') this.renderBuildPanel();
    if(this.game.mode==='buy') this.renderBuyPanel();
  }
  refreshHUD(){
    const g=this.game; if(!g?.started) return;
    const c=g.selected;
    $('#dayLabel').textContent=g.time.weekdayName;
    const w=WEATHERS[g.weather]||WEATHERS.sun;
    const hol=g.time.holiday?` · ${g.time.holiday.icon} ${g.time.holiday.name}`:'';
    $('#dateLabel').textContent=`Dia ${g.time.day} · ${g.time.season}${hol}`;
    $('#weatherIcon').textContent=w.icon; $('#weatherLabel').textContent=w.name;
    $('#moneyLabel').textContent=formatMoney(g.money);
    $('#clockLabel').textContent=g.time.clock;
    if(c){
      $('#hudName').textContent=c.name;
      const emo=c.getEmotionInfo();
      $('#hudEmotion').textContent=`${emo.icon} ${emo.label}`;
      $('#hudEmotion').style.background=emo.color;
      $('#lvlBadge').textContent=c.stageInfo.icon;
      this.drawPortraitIn($('#hudPortrait'),c);
      const needs=NEEDS.map(n=>{
        const v=Math.round(c.needs[n.id]);
        return `<span class="need-chip" title="${n.label}: ${v}"><i style="height:${v}%;background:${NEED_COLORS(v)}"></i><span>${n.icon}</span></span>`;
      }).join('');
      const mn=$('#miniNeeds');
      mn.innerHTML=needs;
      mn.style.display=g.settings.needsOpen?'flex':'none';
      $('#needsToggle').textContent=g.settings.needsOpen?'▾':'▸';
    }
    this.refreshQueue();
  }
  tickHUD(){
    if(!this.game?.started) return;
    this.refreshHUD(); this.refreshSpeed();
    if(this.partyEl&&this.game.party&&!this.partyEl.classList.contains('hidden')){
      const left=Math.max(0,Math.round(this.game.party.endsAt-this.game.absMinutes));
      $('#partyBannerTime').textContent=formatMinutes(left);
      $('#partyBannerProgress').textContent=`${this.game.party.progress}/${this.game.party.goal}`;
    }
  }
  toggleNeeds(){
    this.game.settings.needsOpen=!this.game.settings.needsOpen;
    this.refreshHUD();
  }
  drawPortraitIn(canvas,c){ drawPortrait(canvas,c,{time:performance.now()/1000}); }
  refreshSpeed(){
    const speed=this.game.time.paused?0:this.game.time.speed;
    $$('#speedGroup button').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===speed));
    if(this.game.settings.autoSkip&&this.game.allHouseholdSleeping()&&this.game.simRunning){
      $('#clockLabel').title='Avançando enquanto todos dormem';
    }
  }
  refreshModes(){
    $$('#modeBar button').forEach(b=>b.classList.toggle('active',b.dataset.mode===this.game.mode));
    const showHud=this.game.mode!=='buy'&&this.game.mode!=='build'&&this.startVisible===false;
    $('#hud').classList.toggle('hidden',!showHud);
    $('#zoomControls').classList.toggle('hidden',this.startVisible);
    $('#queueBar').classList.toggle('hidden',this.game.mode!=='live'||this.startVisible);
    document.body.classList.toggle('building',this.game.mode==='buy'||this.game.mode==='build');
  }
  refreshNotifBadge(){
    const n=this.game.notifications?.length||0;
    if(n>this.lastNotifLen) this.unread+=n-this.lastNotifLen;
    this.lastNotifLen=n;
    const badge=$('#notifBadge');
    badge.textContent=this.unread>9?'9+':String(this.unread);
    badge.classList.toggle('hidden',this.unread<=0);
  }
  refreshQueue(){
    const g=this.game, c=g?.selected;
    const bar=$('#queueBar');
    if(!g?.started||!c||g.mode!=='live'||!c.queue.length){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
    bar.classList.remove('hidden');
    bar.innerHTML=c.queue.slice(0,6).map((a,i)=>{
      const pct=i===0&&a.phase==='doing'?Math.min(100,Math.round(a.elapsed/a.minutes*100)):0;
      return `<div class="q-item ${i===0?'active':''}" data-q="${i}"><span class="q-ico">${a.icon||'✨'}</span><span class="q-meta"><span class="q-name">${escapeHtml(a.name)}</span><span class="q-progress"><i style="width:${pct}%"></i></span></span><button class="q-cancel" data-cancel="${i}" aria-label="Cancelar">✕</button></div>`;
    }).join('');
    $$('.q-cancel',bar).forEach(btn=>btn.addEventListener('click',e=>{
      e.stopPropagation(); g.cancelAction(c,Number(btn.dataset.cancel)); this.refreshQueue();
    }));
  }
  refreshParty(){
    if(!this.partyEl) return;
    const p=this.game.party;
    if(!p||!this.game.started){ this.partyEl.classList.add('hidden'); return; }
    const left=Math.max(0,Math.round(p.endsAt-this.game.absMinutes));
    this.partyEl.classList.remove('hidden');
    this.partyEl.innerHTML=`<span class="pb-ico">${p.icon}</span><span class="pb-text"><b>${escapeHtml(p.name)}</b><small>Socialize! <span id="partyBannerProgress">${p.progress}/${p.goal}</span> · <span id="partyBannerTime">${formatMinutes(left)}</span></small></span><button id="partyClose" aria-label="Encerrar festa">✕</button>`;
    $('#partyClose').addEventListener('click',()=>{ this.game.endParty(); this.refreshParty(); });
  }
  toast(text,type='info'){
    const layer=$('#toastLayer');
    if(!layer) return;
    const el=document.createElement('div'); el.className='toast';
    const icons={success:'✅',error:'⚠️',info:'💬',levelup:'⭐',cash:'💵'};
    el.innerHTML=`<span class="t-ico">${icons[type]||'💬'}</span><span>${escapeHtml(text)}</span>`;
    layer.appendChild(el);
    while(layer.children.length>3) layer.firstChild.remove();
    setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),280); },3800);
  }

  /* ---------- Generic modal helpers ---------- */
  closeAll(){
    this.modalRoot.innerHTML='';
    this.charPanelOpen=false;
    this.modalType=null;
    document.body.classList.remove('building');
    this.renderer?.camera && (this.renderer.camera.follow=this.renderer.camera.follow);
  }
  closeModal(){
    this.modalRoot.innerHTML='';
    this.charPanelOpen=false; this.modalType=null;
  }
  scrim(close=true){
    const el=document.createElement('div'); el.className='scrim';
    if(close) el.addEventListener('click',e=>{if(e.target===el){ this.handleClose(); }});
    return el;
  }
  handleClose(){
    if(this.game.mode!=='live') this.game.setMode('live');
    else this.closeModal();
  }
  openSheet(title,subtitle,bodyHTML,opts={}){
    this.charPanelOpen=false;
    const frag=document.createDocumentFragment();
    frag.appendChild(this.scrim(true));
    const sheet=document.createElement('section'); sheet.className='sheet';
    sheet.innerHTML=`<div class="sheet-head"><div><h2>${title}</h2>${subtitle?`<small>${subtitle}</small>`:''}</div><button class="close-btn" aria-label="Fechar">✕</button></div><div class="sheet-body">${bodyHTML}</div>`;
    $('.close-btn',sheet).addEventListener('click',()=>this.handleClose());
    frag.appendChild(sheet);
    this.modalRoot.innerHTML=''; this.modalRoot.appendChild(frag);
    return sheet;
  }
  openFull(title,subtitle,bodyHTML){
    this.charPanelOpen=false;
    const frag=document.createDocumentFragment();
    frag.appendChild(this.scrim(true));
    const panel=document.createElement('section'); panel.className='full-modal';
    panel.innerHTML=`<div class="full-head"><div style="flex:1"><h2>${title}</h2>${subtitle?`<small style="font-size:9px;color:#a995c1">${subtitle}</small>`:''}</div><button class="close-btn" aria-label="Fechar">✕</button></div><div class="full-body">${bodyHTML}</div>`;
    $('.close-btn',panel).addEventListener('click',()=>this.handleClose());
    frag.appendChild(panel);
    this.modalRoot.innerHTML=''; this.modalRoot.appendChild(frag);
    return panel;
  }
  needBars(char,compact=false){
    return `<div class="${compact?'mini-needs':''}">${NEEDS.map(n=>{
      const v=Math.round(char.needs[n.id]);
      if(compact) return `<span class="need-chip" title="${n.label}"><i style="height:${v}%;background:${NEED_COLORS(v)}"></i><span>${n.icon}</span></span>`;
      return `<div class="need-row"><span class="n-ico">${n.icon}</span><span class="n-label">${n.label}</span><span class="need-bar"><i style="width:${v}%;background:${NEED_COLORS(v)}"></i></span><span class="n-val">${v}</span></div>`;
    }).join('')}</div>`;
  }

  /* ---------- Object action menu ---------- */
  actionAvailability(char,id,obj=null,recipe=null){
    const def=ACTIONS[id]; if(!def) return 'Indisponível';
    if(char.hidden) return 'Fora de casa';
    if(obj?.burning && id!=='extinguish') return 'Está pegando fogo';
    if(obj?.broken && !['repair','clean','extinguish','toggle_light','pay_bills'].includes(id)) return 'Precisa consertar';
    if(this.game.bills.utilitiesOff && ['shower','bath','laundry','program','browse','job_search','social_media','freelance','watch_tv','play_game','coffee','cook','wash_dishes'].includes(id)) return 'Luz/água cortada';
    if(id==='eat_meal'&&char.inventory.meals<1) return 'Sem refeição pronta';
    if(id==='cook'&&char.stageInfo.id==='crianca') return 'Crianças não cozinham';
    if(id==='go_work'&&!char.stageInfo.canWork) return 'Jovem demais';
    if(def.requires?.skill) for(const [sid,lvl] of Object.entries(def.requires.skill)) if(char.skillLevel(sid)<lvl) return `${SKILL_MAP[sid].name} ${lvl}+`;
    if(['workout','swim','paint','write_book','program'].includes(id)&&char.stageInfo.id==='bebe') return 'Bebê não consegue';
    if(recipe&&char.skillLevel('culinaria')<recipe.level) return `Culinária ${recipe.level}+`;
    if(recipe&&this.game.money<recipe.cost) return 'Pixels insuficientes';
    if(id==='upgrade'&&this.game.money<120) return 'Pixels insuficientes';
    return null;
  }
  showObjectMenu(obj){
    const g=this.game, c=g.selected; if(!c||!obj) return;
    const def=objDef(obj);
    let ids=def.actions.slice();
    if(obj.burning) ids=['extinguish'];
    else {
      if(obj.dirty>20&&!ids.includes('clean')) ids.push('clean');
      if((obj.broken||obj.condition<55)&&!ids.includes('repair')) ids.push('repair');
      if(def.upgradable&&(obj.upgraded||0)<3&&!ids.includes('upgrade')) ids.push('upgrade');
    }
    if(obj.garden?.planted&&obj.garden.growth>=100&&!ids.includes('harvest')) ids.push('harvest');
    if(obj.garden?.planted&&!obj.garden.watered&&!ids.includes('water')) ids.push('water');
    if(!obj.garden?.planted&&ids.includes('water')) ids=ids.filter(x=>x!=='water');
    const seen=new Set();
    const actions=ids.filter(id=>{ if(seen.has(id))return false;seen.add(id);return true;}).map(id=>{
      const a=ACTIONS[id]; if(!a) return null;
      let reason=this.actionAvailability(c,id,obj);
      if(id==='cook'&&!RECIPES.some(r=>r.level<=c.skillLevel('culinaria'))) reason='Culinária baixa';
      let cost=a.money?` · P$ ${a.money}`:'';
      if(id==='upgrade') cost=' · P$ 120';
      return {id,a,reason,cost};
    }).filter(Boolean);
    const status=[];
    if(obj.dirty>20) status.push('Sujo');
    if(obj.broken) status.push('Quebrado');
    if(obj.burning) status.push('Em chamas');
    if(obj.upgraded) status.push(`Melhorado x${obj.upgraded}`);
    status.push(`Ambiente +${def.ambience||0}`);
    const body=`<div class="panel-card" style="display:flex;gap:9px;align-items:center"><span style="font-size:28px">${def.icon||'📦'}</span><div><b style="font-size:12px">${escapeHtml(def.name)}</b><div style="font-size:9px;color:#bfaed8;margin-top:2px">${status.join(' · ')} · ${obj.condition}% conservação</div></div></div>
      <div class="action-grid">${actions.map(x=>`<button class="action-btn ${x.reason?'locked':''}" data-a="${x.id}" ${x.reason?'disabled':''}><span class="a-ico">${x.a.icon}</span><span class="a-text"><b>${x.a.name}</b><small>${x.reason||`${formatMinutes(x.a.minutes)}${x.cost}`}</small></span></button>`).join('')}</div>
      ${actions.length?'':'<p style="font-size:11px;color:#bca9d6">Nenhuma ação disponível agora.</p>'}
      <div class="btn-row" style="margin-top:9px"><button class="btn ghost small" id="goToObj">🚶 Ir até o objeto</button></div>`;
    const sheet=this.openSheet(`${def.icon||'📦'} ${escapeHtml(def.name)}`,`Toque em uma ação para ${c.name}`,body);
    $$('.action-btn[data-a]',sheet).forEach(btn=>btn.addEventListener('click',()=>{
      const id=btn.dataset.a;
      if(id==='cook') this.showRecipeMenu(obj);
      else if(id==='plant') this.showPlantMenu(obj);
      else { g.queueAction(c,id,{targetUid:obj.uid}); this.handleClose(); }
    }));
    $('#goToObj',sheet)?.addEventListener('click',()=>{ g.moveNearObject(obj); this.handleClose(); });
  }
  showRecipeMenu(obj){
    const c=this.game.selected; if(!c) return;
    const body=`<div style="display:grid;gap:6px">${RECIPES.map(r=>{
      const lock=this.actionAvailability(c,'cook',obj,r);
      return `<button class="action-btn ${lock?'locked':''}" data-r="${r.id}" ${lock?'disabled':''}><span class="a-ico">${r.icon}</span><span class="a-text"><b>${r.name}</b><small>${lock||`Culinária ${r.level}+ · P$ ${r.cost} · ${formatMinutes(r.minutes)}`}</small></span></button>`;
    }).join('')}</div><p style="font-size:9px;color:#a995c1;margin:8px 2px 0">Cozinhar gera refeições. Depois use a mesa para comer.</p>`;
    const sheet=this.openSheet('🍳 O que vamos cozinhar?',`Skill de Culinária: nível ${c.skillLevel('culinaria')} · ${c.inventory.meals} refeição(ões)`,body);
    $$('.action-btn[data-r]',sheet).forEach(btn=>btn.addEventListener('click',()=>{
      const rec=RECIPES.find(r=>r.id===btn.dataset.r);
      this.game.queueAction(c,'cook',{targetUid:obj.uid,recipe:rec});
      this.handleClose();
    }));
  }
  showPlantMenu(obj){
    const c=this.game.selected; if(!c) return;
    const body=`<div class="action-grid">${CROPS.map(crop=>`<button class="action-btn" data-crop="${crop.id}"><span class="a-ico">${crop.icon}</span><span class="a-text"><b>${crop.name}</b><small>Venda P$ ${crop.value} · cresce em ${crop.grow*8}h</small></span></button>`).join('')}</div>`;
    const sheet=this.openSheet('🌱 Escolha a semente','O canteiro aceita uma planta por vez.',body);
    $$('.action-btn[data-crop]',sheet).forEach(btn=>btn.addEventListener('click',()=>{
      this.game.queueAction(c,'plant',{targetUid:obj.uid,crop:btn.dataset.crop});
      this.handleClose();
    }));
  }

  /* ---------- Social menu ---------- */
  showSocialMenu(target){
    const g=this.game,c=g.selected;
    if(!c||!target||c.id===target.id) return;
    const rel=c.relationship(target.id);
    const socs=g.availableSocialActions(c,target);
    const cats=Object.entries(SOCIAL_CATS);
    const body=`<div class="panel-card"><div style="display:flex;align-items:center;gap:9px;margin-bottom:6px"><span style="font-size:26px">${target.stageInfo.icon}</span><div style="flex:1"><b style="font-size:13px">${escapeHtml(target.fullName)}</b><div style="font-size:9px;color:#bfaed8">${target.ageLabel} · ${target.isNPC?(target.npcJob||'Morador do bairro'):'Sua família'}</div></div><span class="chip mint">${escapeHtml(c.statusWith(target.id))}</span></div>
      <div class="rel-bars"><span class="rel-bar" title="Amizade"><i style="width:${rel.friend}%;background:var(--mint)"></i></span><span class="rel-bar" title="Romance"><i style="width:${rel.romance}%;background:var(--pink)"></i></span></div><div style="font-size:8px;color:#a995c1;margin-top:3px">Amizade ${Math.round(rel.friend)} · Romance ${Math.round(rel.romance)}</div></div>
      ${cats.map(([cat,info])=>{
        const list=socs.filter(s=>s.cat===cat);
        return `<h4 style="font-size:10px;color:var(--yellow);margin:10px 2px 5px">${info.icon} ${info.name}</h4><div class="action-grid">${list.map(s=>`<button class="action-btn social ${s.locked?'locked':''}" data-s="${s.id}" ${s.locked?'disabled':''}><span class="a-ico">${s.icon}</span><span class="a-text"><b>${s.name}</b><small>${s.locked?s.reason:formatMinutes(s.minutes)}</small></span></button>`).join('')}</div>`;
      }).join('')}`;
    const sheet=this.openSheet(`💬 ${escapeHtml(target.name)}`,`O que ${c.name} vai fazer?`,body);
    $$('.action-btn[data-s]',sheet).forEach(btn=>btn.addEventListener('click',()=>{
      g.queueSocial(c,target.id,btn.dataset.s);
      this.handleClose();
    }));
  }
  showTileMenu(tx,ty){
    const g=this.game;
    if(g.mode!=='live') return;
    const body=`<div class="action-grid"><button class="action-btn" data-t="move"><span class="a-ico">🚶</span><span class="a-text"><b>Ir até aqui</b><small>${tx}, ${ty}</small></span></button><button class="action-btn" data-t="center"><span class="a-ico">⌖</span><span class="a-text"><b>Centralizar câmera</b><small>Ver este cantinho</small></span></button><button class="action-btn" data-t="build"><span class="a-ico">🧱</span><span class="a-text"><b>Construir aqui</b><small>Abrir modo construir</small></span></button></div>`;
    const sheet=this.openSheet('📍 Neste ponto',g.currentLot.name,body);

  /* ---------- Character sheet ---------- */
  openCharacterPanel(tab='needs'){
    const c=this.game.selected; if(!c) return;
    this.charPanelOpen=true; this.charTab=tab;
    this.renderCharacterPanel(tab);
  }
  renderCharacterPanel(tab='needs',preserve=false){
    const g=this.game,c=g.selected; if(!c) return;
    this.charTab=tab;
    if(!this.charPanelOpen) return;
    const tabs=[
      ['needs','Necessidades','❤️'],['skills','Habilidades','⭐'],['relationships','Relações','💬'],
      ['career','Carreira','💼'],['aspiration','Aspiração','🌟'],['inventory','Inventário','🎒'],
    ];

    const switcher=g.characters.length>1?`<div style="display:flex;gap:5px;overflow-x:auto;margin-bottom:9px">${g.characters.map(ch=>`<button class="chip ${ch.id===c.id?'mint':''}" data-switch="${ch.id}" style="min-height:30px">${ch.stageInfo.icon} ${escapeHtml(ch.name)}</button>`).join('')}</div>`:'';
    let content='';
    if(tab==='needs'){
      content=`${hero}${switcher}<div class="panel-card"><h4>❤️ Como está se sentindo</h4>${this.needBars(c)}
        <div class="moodlet"><span>${c.getEmotionInfo().icon}</span><b>${c.getEmotionInfo().label}</b><span class="tag good">${g.moodValueLabel?g.moodValueLabel(c):(c.moodValue()>=25?'Ótimo':c.moodValue()>=-10?'Estável':'Péssimo')}</span></div>
        ${c.moodlets.length?c.moodlets.map(m=>`<div class="moodlet ${m.weight<0?'neg':''}"><span>${m.icon}</span><b>${escapeHtml(m.label)}</b><small>${m.weight>0?'+':''}${m.weight}</small></div>`).join(''):'<p style="font-size:9px;color:#a995c1">Sem moodlets no momento.</p>'}
      </div><div class="panel-card"><h4>🧬 Traços</h4>${c.traitInfo.map(t=>`<span class="chip yellow">${t.icon} ${t.name}</span>`).join('')}<p style="margin-top:6px">${c.traitInfo.map(t=>t.desc).join(' ')}</p></div>`;
    } else if(tab==='skills'){
      content=`${hero}${switcher}<div class="panel-card"><h4>⭐ Habilidades</h4><div class="skill-grid">${SKILLS.map(s=>{
        const p=c.skillProgress(s.id);
        return `<div class="skill-item"><div class="skill-top"><span>${s.icon} ${s.name}</span><b>Nv ${p.level}</b></div><div class="level-dots">${Array.from({length:10},(_,i)=>`<i class="${i<p.level?'on':''}"></i>`).join('')}</div><small style="font-size:7px;color:#9e8ab7">${p.pct>99?'MÁX':`${Math.round(p.pct)}%`}</small></div>`;
      }).join('')}</div></div>`;
    } else if(tab==='relationships'){
      const ids=new Set();
      g.characters.forEach(x=>{if(x.id!==c.id)ids.add(x.id);});
      g.npcs.forEach(x=>{if(x.id!==c.id&&c.relationships[x.id]?.met)ids.add(x.id);});
      Object.entries(c.relationships).forEach(([id,r])=>{if(r.met&&id!==c.id)ids.add(id);});
      const rows=[...ids].map(id=>{
        const rec=g.personRecord(id); const rel=c.relationship(id);
        const present=g.findPerson(id);
        return `<div class="rel-item"><span class="rel-avatar">${present?.stageInfo?.icon||'🧑'}</span><div class="rel-mid"><div class="rel-name"><span style="color:var(--cream)">${escapeHtml(rec.name.split(' ')[0])}</span><span>${escapeHtml(c.statusWith(id))}</span></div><div class="rel-bars"><span class="rel-bar"><i style="width:${rel.friend}%;background:var(--mint)"></i></span><span class="rel-bar"><i style="width:${rel.romance}%;background:var(--pink)"></i></span></div></div><div class="rel-actions">${present?`<button data-talk="${id}" title="Interagir">💬</button>`:`<button data-invite="${id}" title="Convidar">🫖</button>`}</div></div>`;
      }).join('');
      content=`${hero}${switcher}<div class="panel-card"><h4>💬 Relações</h4><div class="rel-list">${rows||'<p style="font-size:10px;color:#a995c1">Ainda não conhece ninguém. Vá ao parque ou café!</p>'}</div></div>`;
    } else if(tab==='career'){
      const info=g.getCareerInfo(c);
      if(!info){
        content=`${hero}${switcher}<div class="panel-card"><h4>💼 Carreira</h4><p>${c.stageInfo.canWork?'Sem emprego no momento. Procure uma vaga pelo celular ou computador.':'Ainda não tem idade para trabalhar.'}</p><div class="btn-row" style="margin-top:8px"><button class="btn primary small" id="findJob">🔎 Procurar emprego</button></div></div>`;
      } else {
        const {job,level,next,canWorkNow}=info;
        const perf=Math.round(c.career.performance||0);
        content=`${hero}${switcher}<div class="panel-card"><div class="career-head"><span class="career-icon">${job.icon}</span><div style="flex:1"><h4 style="margin:0">${job.name}</h4><b style="font-size:12px">${escapeHtml(level.title)}</b><div style="font-size:9px;color:#bfaed8">${job.hours[0]}h–${job.hours[1]}h · ${job.days.map(d=>WEEKDAYS[d].slice(0,3)).join(', ')}</div></div></div>
          <div class="need-row"><span class="n-label">Desempenho</span><span class="need-bar"><i style="width:${perf}%;background:${NEED_COLORS(perf)}"></i></span><span class="n-val">${perf}%</span></div>
          <div style="font-size:10px;color:#e3d5f2;margin:6px 0">Salário de hoje: <b style="color:var(--yellow)">${formatMoney(level.pay)}</b> · Dias trabalhados: ${c.career.daysWorked}</div>
          <div class="btn-row"><button class="btn ${canWorkNow.ok?'primary':'ghost'} small" id="workBtn" ${canWorkNow.ok?'':'disabled'}>${canWorkNow.ok?'💼 Ir trabalhar':canWorkNow.reason}</button><button class="btn ghost small" id="quitBtn">👋 Demitir</button></div>
          ${next?`<p style="margin-top:7px;font-size:9px;color:#bba9d4">Próximo: <b>${next.title}</b> · ${formatMoney(next.pay)}/dia · ${SKILL_MAP[job.skill].name} ${next.req}+</p>`:'<p style="margin-top:7px;font-size:9px;color:var(--mint)">Nível máximo! Você é lenda.</p>'}
          <div class="career-levels">${job.levels.map((l,i)=>`<div class="career-step ${i===c.career.level?'current':''}"><span>${i+1}. ${l.title}</span><span>${formatMoney(l.pay)}</span></div>`).join('')}</div>
        </div>`;
      }
    } else if(tab==='aspiration'){
      const asp=c.aspirationInfo;
      const done=c.aspirationDone||{};
      content=`${hero}${switcher}<div class="aspiration-card"><h3>${asp.icon} ${asp.name}</h3><p>${asp.desc}</p>${asp.milestones.map(m=>`<div class="milestone ${done[m.id]?'done':''}"><span class="m-dot">${done[m.id]?'✓':''}</span><span>${m.label}</span><small>${done[m.id]?'feito':`${Math.min(100,Math.round(g.statValue(c,m.stat)/m.target*100))}%`}</small></div>`).join('')}</div><div class="panel-card"><h4>🪞 Pequenas vitórias</h4><p>Quadros: ${c.stats.paintings||0} · Livros: ${c.stats.books||0} · Peixes: ${c.stats.fish||0}<br>Treinos: ${c.stats.workouts||0} · Ações sociais: ${c.stats.socials||0} · Encontros: ${c.stats.dates||0}</p></div>`;
    } else {
      const items=c.inventory.items||[];
      const food=`<div class="inv-item">🍱 <span>Refeições prontas</span><b style="margin-left:auto">${c.inventory.meals}</b></div>`;
      const itemRows=items.map(it=>`<div class="inv-item"><span>${it.icon}</span><span style="flex:1;min-width:0">${escapeHtml(it.name)}<br><small style="color:var(--yellow)">P$ ${it.value}</small></span><button class="btn small yellow" data-sell="${it.uid}" style="min-height:28px;padding:2px 6px;font-size:8px">Vender</button></div>`).join('');
      content=`${hero}${switcher}<div class="panel-card"><h4>🎒 Inventário</h4><div class="inv-grid">${food}</div><div class="inv-grid" style="margin-top:5px">${itemRows||'<p style="font-size:10px;color:#a995c1">Mochila vazia. Crie arte, pesque ou colha algo!</p>'}</div></div>`;
    }
    const panel=this.openFull(`${c.stageInfo.icon} ${escapeHtml(c.fullName)}`,`${c.ageLabel} · ${c.aspirationInfo.icon} ${c.aspirationInfo.name}`,`
      <div class="tabs">${tabs.map(t=>`<button class="tab-btn ${t[0]===tab?'active':''}" data-tab="${t[0]}">${t[2]} ${t[1]}</button>`).join('')}</div>
      <div style="padding-top:10px">${content}</div>`);
    this.charPanelOpen=true; this.modalType='character';
    this.drawPortraitIn($('#charHeroCanvas'),c);
    $$('.tab-btn',panel).forEach(b=>b.addEventListener('click',()=>this.renderCharacterPanel(b.dataset.tab)));
    $$('[data-switch]',panel).forEach(b=>b.addEventListener('click',()=>{g.selectCharacter(b.dataset.switch);this.renderCharacterPanel(tab);}));
    $$('[data-talk]',panel).forEach(b=>b.addEventListener('click',()=>{const person=g.findPerson(b.dataset.talk);if(person){this.closeModal();this.showSocialMenu(person);}}));
    $$('[data-invite]',panel).forEach(b=>b.addEventListener('click',()=>{g.inviteFriend();this.closeModal();}));
    $$('[data-sell]',panel).forEach(b=>b.addEventListener('click',()=>{g.sellItem(c,b.dataset.sell);this.renderCharacterPanel('inventory');}));
    $('#findJob',panel)?.addEventListener('click',()=>this.openJobs(c));
    $('#workBtn',panel)?.addEventListener('click',()=>{g.startWork(c);this.closeModal();});
    $('#quitBtn',panel)?.addEventListener('click',()=>{ if(confirm('Pedir demissão agora?')){ g.quitJob(c); this.renderCharacterPanel('career'); } });
    if(tab==='relationships' && !panel) {}
  }
  openJobs(char){
    const jobs=this.game.jobListFor(char);
    const body=`<div class="panel-card"><p>${char.stageInfo.canWork?'Vagas abertas no bairro. O salário é por dia trabalhado.':'Ainda não tem idade para trabalhar.'}</p></div>
      <div style="display:flex;flex-direction:column;gap:6px">${jobs.map(j=>`<div class="panel-card" style="display:flex;gap:8px;align-items:center;margin:0"><span class="career-icon" style="width:36px;height:36px;font-size:19px">${j.icon}</span><div style="flex:1;min-width:0"><b style="font-size:11px">${j.name}</b><div style="font-size:8px;color:#bfaed8">${escapeHtml(j.levels[0].title)} · ${formatMoney(j.entryPay)}/dia · ${j.hoursText}</div><div style="font-size:7px;color:#9e8ab7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${j.dayText}</div></div><button class="btn ${char.career.jobId===j.id?'ghost':'primary'} small" data-job="${j.id}" ${char.career.jobId===j.id?'disabled':''}>${char.career.jobId===j.id?'Atual':'Candidatar'}</button></div>`).join('')}</div>`;

  /* ---------- Notifications ---------- */
  showNotifications(){
    this.unread=0; this.refreshNotifBadge();
    const list=this.game.notifications||[];
    const body=`<div class="log-list">${list.length?list.map(n=>`<div class="log-item"><span class="li-ico">${n.icon||'✨'}</span><span style="flex:1">${escapeHtml(n.text)}</span><time>${n.time||''}</time></div>`).join(''):'<p style="font-size:11px;color:#bca9d6">Nada por aqui ainda. Viva um pouco!</p>'}</div><div class="btn-row" style="margin-top:9px"><button class="btn ghost small" id="clearLog">Limpar histórico</button></div>`;

  /* ---------- Mode overlay routing ---------- */
  onModeChange(mode){
    this.closeModal();
    this.refreshModes();
    if(mode==='map') this.renderMap();
    else if(mode==='phone') this.renderPhone();
    else if(mode==='menu') this.renderMenu();
    else if(mode==='build') this.renderBuildPanel();
    else if(mode==='buy') this.renderBuyPanel();
    else { this.closeModal(); this.refreshModes(); }
  }
  renderMap(){
    const g=this.game;
    const body=`<div class="map-scenery"><span class="map-cloud">☁️</span></div><p class="map-note">Escolha um lugar. Levar a família toda é grátis; a vida é que cobra.</p><div class="map-grid">${LOT_META.map(m=>`<button class="map-card ${m.id===g.currentLotId?'here':''}" data-lot="${m.id}"><span class="map-ico">${m.icon}</span><b>${m.name}</b><small>${m.blurb}</small><span class="map-tag">${m.id===g.currentLotId?'Aqui':m.type}</span></button>`).join('')}</div><p class="map-note">🏡 ${escapeHtml(g.homeLot?.name||'Casa Aurora')} é seu lar atual.</p>`;
    const panel=this.openFull('🗺 Mapa do bairro','Toque em um lugar para ir.',body);
    $$('.map-card[data-lot]',panel).forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.lot;
      if(id===g.currentLotId){ this.handleClose(); return; }
      const lot=g.lots[id];
      if(lot?.forSale&&!lot.playerOwned){ this.closeModal(); g.travelTo(id); return; }
      g.travelTo(id);
    }));
  }
  renderPhone(){
    const g=this.game,c=g.selected;
    const body=this.phoneApp==='home'?this.phoneHome():this.phoneAppBody(this.phoneApp);
    const frag=document.createDocumentFragment();
    frag.appendChild(this.scrim(true));
    const shell=document.createElement('div'); shell.className='phone-shell';
    shell.innerHTML=`<div class="phone-notch">PIXEL·FONE 8</div><div class="phone-screen">${body}</div><div class="phone-home-btn"><i></i></div>`;
    frag.appendChild(shell);
    this.modalRoot.innerHTML='';this.modalRoot.appendChild(frag);
    $('.scrim',frag)?.addEventListener('click',()=>this.handleClose());
    $$('[data-app]',shell).forEach(b=>b.addEventListener('click',()=>{this.phoneApp=b.dataset.app;this.renderPhone();}));
    $('#phoneHome',shell)?.addEventListener('click',()=>this.handleClose());
    $$('[data-phone]',shell).forEach(b=>b.addEventListener('click',()=>this.phoneAction(b.dataset.phone,b.dataset.id)));
    $('#phoneBack',shell)?.addEventListener('click',()=>{this.phoneApp='home';this.renderPhone();});
  }

    }
